<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RepairWings | Login</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    body { background: #f8fafc; color: #0f172a; }

    /* Auth Screen */
    #auth-screen { min-height: 100vh; background: #1d4ed8; color: white; padding: 40px 24px; display: flex; flex-direction: column; justify-content: center; }
    .auth-title { font-size: 32px; font-weight: 800; margin-bottom: 20px; }
    .role-btn { background: white; color: #1d4ed8; padding: 16px; border-radius: 12px; margin-bottom: 12px; font-weight: 700; text-align: center; cursor: pointer; }
    
    /* Dashboard & Tabs (Same as before) */
    #app-interface { display: none; padding-bottom: 75px; }
    /* ... (Baaki CSS wahi rahegi jo upar di thi) ... */
  </style>
</head>
<body>

  <!-- Login Selection -->
  <div id="auth-screen">
    <div class="auth-title">RepairWings</div>
    <p style="margin-bottom: 30px; opacity: 0.9;">Aap yahan kaise login karna chahte hain?</p>
    
    <div class="role-btn" onclick="startLogin('customer')">Login as Customer 👤</div>
    <div class="role-btn" onclick="startLogin('partner')" style="background: #eff6ff;">Login as Partner 🔧</div>
  </div>

  <!-- Dashboard (yahan content aayega) -->
  <div id="app-interface">
    <!-- Ye dynamic change hoga -->
  </div>

  <script>
    let currentRole = "";

    function startLogin(role) {
      currentRole = role;
      let phone = prompt("Apna mobile number enter karein:");
      if(phone && phone.length === 10) {
        alert(role.toUpperCase() + " Login Successful!");
        showDashboard(role);
      } else {
        alert("Valid 10-digit number daalein.");
      }
    }

    function showDashboard(role) {
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('app-interface').style.display = 'block';
      
      // Yahan logic hai: Agar Partner hai toh sirf leads dikhao, Customer hai toh home page
      if(role === 'partner') {
        document.getElementById('app-interface').innerHTML = `
          <div style="padding: 20px;">
            <h2>Partner Dashboard</h2>
            <p>Aapki active leads yahan hongi.</p>
            <div id="partner-leads">No leads yet.</div>
          </div>
        `;
      } else {
        // Customer ka original dashboard code yahan aayega
      }
    }
  </script>
</body>
</html>
