<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RepairWings - Professional Service Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans pb-20">

    <!-- Header / Navbar -->
    <header class="bg-white shadow-sm p-4 flex justify-between items-center sticky top-0 z-50">
        <h1 class="text-xl font-bold text-blue-600">RepairWings</h1>
        <div id="auth-section">
            <button id="open-modal-btn" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow hover:bg-blue-700 transition">Login / Register</button>
        </div>
        <div id="user-profile" class="hidden flex items-center gap-2">
            <span id="user-name" class="text-xs font-medium"></span>
            <span id="user-role-badge" class="text-[10px] bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded font-semibold"></span>
            <button id="logout-btn" class="text-red-500 text-xs hover:underline font-medium ml-1">Logout</button>
        </div>
    </header>

    <main id="main-content" class="p-4 max-w-lg mx-auto">
        <h2 class="text-2xl font-extrabold text-gray-900 mb-6">Expert Repair Services</h2>

        <!-- Service Grid -->
        <div class="grid grid-cols-2 gap-3 mb-6">
            <div onclick="selectCategory('Mobile', 1200)" class="bg-white p-4 rounded-2xl shadow-sm border hover:border-blue-500 cursor-pointer">
                <div class="text-2xl mb-2">📱</div>
                <div class="font-bold text-sm">Mobile</div>
            </div>
            <div onclick="selectCategory('TV', 2500)" class="bg-white p-4 rounded-2xl shadow-sm border hover:border-blue-500 cursor-pointer">
                <div class="text-2xl mb-2">📺</div>
                <div class="font-bold text-sm">TV</div>
            </div>
            <div onclick="selectCategory('AC', 1500)" class="bg-white p-4 rounded-2xl shadow-sm border hover:border-blue-500 cursor-pointer">
                <div class="text-2xl mb-2">❄️</div>
                <div class="font-bold text-sm">AC</div>
            </div>
            <div onclick="selectCategory('Fridge', 1200)" class="bg-white p-4 rounded-2xl shadow-sm border hover:border-blue-500 cursor-pointer">
                <div class="text-2xl mb-2">🧊</div>
                <div class="font-bold text-sm">Fridge</div>
            </div>
        </div>

        <!-- Booking Form -->
        <div id="booking-container" class="hidden bg-white p-5 rounded-2xl shadow-md border border-blue-100 mb-6">
            <h3 class="font-bold text-blue-600 text-sm mb-3" id="booking-title">Book Service</h3>
            <form id="booking-form" class="space-y-3">
                <input type="hidden" id="selected-appliance">
                <textarea id="issue-input" rows="2" placeholder="Describe the problem..." class="w-full border rounded-lg p-2.5 text-xs outline-none" required></textarea>
                <div class="bg-blue-50 p-3 rounded-lg text-xs font-bold text-blue-700">Estimated Price: <span id="price-display">₹0</span></div>
                <button type="submit" class="w-full bg-blue-600 text-white p-2.5 rounded-xl font-bold text-xs hover:bg-blue-700 transition">Proceed to Payment</button>
            </form>
        </div>
    </main>

    <!-- Partner KYC (Hidden) -->
    <section id="kyc-section" class="hidden p-6 max-w-sm mx-auto bg-white rounded-2xl shadow-xl my-10">
        <h3 class="font-bold text-blue-600 mb-4">Partner KYC Verification</h3>
        <form id="kyc-form" class="space-y-3">
            <input type="text" id="id-input" placeholder="[ID Redacted]" class="w-full border p-2.5 rounded-lg text-xs" required>
            <input type="text" id="pan-input" placeholder="PAN Number" class="w-full border p-2.5 rounded-lg text-xs" required>
            <button type="submit" class="w-full bg-blue-600 text-white p-2.5 rounded-xl font-bold text-xs">Submit KYC</button>
        </form>
    </section>

    <!-- Role Modal -->
    <div id="role-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-2xl w-full max-w-xs text-center shadow-2xl">
            <h3 class="font-bold text-base mb-4">Select Your Role</h3>
            <button id="role-customer-btn" class="w-full p-3 border rounded-xl mb-2 text-xs font-bold">Login as Customer</button>
            <button id="role-partner-btn" class="w-full p-3 border rounded-xl text-xs font-bold">Login as Partner</button>
        </div>
    </div>

    <!-- Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around py-3 text-[10px] font-bold text-gray-500">
        <div class="flex flex-col items-center text-blue-600"><span>🏠</span>Home</div>
        <div class="flex flex-col items-center"><span>📋</span>Orders</div>
        <div class="flex flex-col items-center"><span>💳</span>Payments</div>
        <div class="flex flex-col items-center"><span>👤</span>Account</div>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = { /* Apna Config Yahan Rakhein */ };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        window.selectCategory = (appliance, price) => {
            if (!auth.currentUser) { document.getElementById('role-modal').classList.remove('hidden'); return; }
            document.getElementById('selected-appliance').value = appliance;
            document.getElementById('booking-title').textContent = `Book ${appliance}`;
            document.getElementById('price-display').textContent = `₹${price}`;
            document.getElementById('booking-container').classList.remove('hidden');
        };

        document.getElementById('role-customer-btn').onclick = () => login('customer');
        document.getElementById('role-partner-btn').onclick = () => login('partner');

        async function login(role) {
            const result = await signInWithPopup(auth, provider);
            await setDoc(doc(db, "users", result.user.uid), { role, kycCompleted: role === 'customer', createdAt: new Date() }, { merge: true });
            location.reload();
        }

        document.getElementById('booking-form').onsubmit = (e) => {
            e.preventDefault();
            alert("Payment Gateway Integration Pending. Logic Ready.");
        };

        document.getElementById('logout-btn').onclick = () => signOut(auth).then(() => location.reload());

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('user-profile').classList.remove('hidden');
                document.getElementById('user-name').textContent = user.displayName;
                const userSnap = await getDoc(doc(db, "users", user.uid));
                if (userSnap.exists() && userSnap.data().role === 'partner' && !userSnap.data().kycCompleted) {
                    document.getElementById('main-content').classList.add('hidden');
                    document.getElementById('kyc-section').classList.remove('hidden');
                }
            }
        });
    </script>
</body>
</html>
